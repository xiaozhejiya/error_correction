# 1Panel OpenResty 网站配置参考。
# SSL 证书、listen 和 server_name 继续由 1Panel 管理，将以下配置合并到
# lamp.dianchuang.club 对应的 server 块中。

client_max_body_size 50m;

location ~ ^/(api|images|download|erased|uploads)(/|$) {
    proxy_pass http://127.0.0.1:15001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 650s;
    proxy_read_timeout 650s;
    proxy_request_buffering off;
}

location / {
    try_files $uri $uri/ /index.html;
}
